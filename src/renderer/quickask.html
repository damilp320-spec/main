<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>Quick Ask</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: transparent; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
    .qa { background: #11141d; border: 1px solid #2a2f3e; border-radius: 16px; box-shadow: 0 24px 64px rgba(0,0,0,.55); overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
    .qa-top { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #222736; }
    .qa-dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg,#7c5cff,#29d3c2); flex: 0 0 auto; }
    .qa-input { flex: 1; background: transparent; border: 0; outline: none; color: #eef1f8; font-size: 17px; }
    .qa-go { background: linear-gradient(135deg,#7c5cff,#29d3c2); color: #0b0e14; border: 0; border-radius: 9px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
    .qa-ctx { padding: 8px 16px; font-size: 12px; color: #8b93a7; border-bottom: 1px solid #222736; display: none; }
    .qa-ctx.on { display: block; }
    .qa-ctx b { color: #29d3c2; }
    .qa-body { flex: 1; overflow-y: auto; padding: 14px 16px; color: #d7dcea; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
    .qa-hint { padding: 8px 16px; font-size: 11px; color: #5a6377; border-top: 1px solid #222736; display: flex; justify-content: space-between; }
    .qa-empty { color: #5a6377; }
    .spin { display: inline-block; animation: sp 1s linear infinite; } @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="qa">
    <div class="qa-top">
      <span class="qa-dot"></span>
      <input id="q-in" class="qa-input" placeholder="Спросите или дайте задание…" autocomplete="off" />
      <button id="q-go" class="qa-go">↵</button>
    </div>
    <div id="q-ctx" class="qa-ctx"></div>
    <div id="q-body" class="qa-body"><span class="qa-empty">Контекст активного окна и буфера обмена подхватывается автоматически.</span></div>
    <div class="qa-hint"><span>Enter — выполнить · Esc — закрыть</span><span id="q-ctxbtn" style="cursor:pointer">📎 контекст: вкл</span></div>
  </div>
  <script src="quick.js"></script>
</body>
</html>
